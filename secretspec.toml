[project]
name = "homelab-iac"
revision = "1.0"

# One canonical home for the GitHub token: OpenBao secret/iac/github. This
# manifest is only the contract; the value never lives in this repo or in
# .env.sops. AppRole credentials come from VAULT_ROLE_ID / VAULT_SECRET_ID in
# .env (SecretSpec's documented fallback), and the read policy is
# svc-desktop-nixos-endeavour-github-token-reader.
[providers.bao_home]
# Tailnet listener is plain HTTP on purpose: WireGuard already authenticates
# and encrypts the only transport (see desktop-nixos discovery/vault.nix).
uri = "openbao://100.103.52.100:8200/secret?auth=approle&tls=false"

[profiles.iac]
GITHUB_TOKEN = { description = "GitHub provider token maintained in OpenBao", ref = { item = "iac/github", field = "token" }, providers = ["bao_home"] }
